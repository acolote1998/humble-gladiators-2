spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/humble-gladiators-2-test-db
    username: testdbusername
    password: testdbusername
    hikari:
      idle-timeout: 30000 # min is 30 sec
      max-lifetime: 60000 # min is 60 sec
      keepalive-time: 0 # don't keep them alive if they're idle
      maximum-pool-size: 10 #
      minimum-idle: 0 # this one's kind of important
      leak-detection-threshold: 60001 # just for debugging, you don't really need it
      data-source-properties:
        prepareThreshold: 0 # disable prepared statement caching

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://test-issuer.example.com

GAME_CREATION_STATE_INTERVAL: 0

# Booster Configuration
UNLIMITED_BOOSTERS_ALLOWED: false

# Battle Configuration
UNLIMITED_BATTLES_ALLOWED: false

