name: Backend Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Test DB Container
        run: docker compose up -d
        working-directory: backend

      - name: Wait for database to be ready
        run: |
          echo "Waiting for database to be ready..."
          timeout 60 bash -c 'until docker exec humble-gladiators-2-postgres-test-db pg_isready -U testdbusername -d humble-gladiators-2-test-db > /dev/null 2>&1; do sleep 2; done'
          echo "Database is ready!"
        working-directory: backend

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Maven test
        run: mvn test --batch-mode

      - name: Stop and clean up containers
        if: always()
        run: docker compose down
        working-directory: backend
